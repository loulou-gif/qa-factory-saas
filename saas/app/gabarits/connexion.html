{% extends "base.html" %}
{% block titre %}Connexion · QA Factory{% endblock %}
{% block contenu %}
<div class="boite">
  <h1>Bienvenue</h1>
  <p class="discret">Connectez-vous pour transformer vos cahiers des charges en cas de tests.</p>
  <form method="post" action="/connexion">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="identifiant">Identifiant</label>
    <input type="text" id="identifiant" name="identifiant" autocomplete="username" required autofocus>
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="mot_de_passe" autocomplete="current-password" required>
    <button class="bouton" type="submit">Se connecter</button>
  </form>
  <p class="discret petit" style="margin-top:1.25rem">Mot de passe oublié : demandez à un administrateur de l'outil.</p>
</div>
{% endblock %}
