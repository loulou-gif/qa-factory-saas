{% extends "base.html" %}
{% block titre %}Connexion — QA Factory{% endblock %}
{% block contenu %}
<div class="carte connexion">
  <h1>Connexion</h1>
  <p class="sous-titre">Chaîne de conception des tests du pôle Test Logiciel.</p>
  <form method="post" action="/connexion">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="identifiant">Identifiant</label>
    <input type="text" id="identifiant" name="identifiant" autocomplete="username" required autofocus>
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="mot_de_passe" autocomplete="current-password" required>
    <div class="actions"><button type="submit">Se connecter</button></div>
  </form>
  <p class="discret">Mot de passe oublié : s'adresser à un administrateur de l'outil.</p>
</div>
{% endblock %}
