<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf }}">
<title>{% block titre %}QA Factory{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2220%22 cy=%2716%27 r=%279%27 fill=%27%23675AA2%27/%3E%3Ccircle cx=%2712%27 cy=%2716%27 r=%279%27 fill=%27%238CD1F2%27/%3E%3C/svg%3E">
<link rel="preload" href="/statique/polices/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/statique/app.css">
</head>
<body>
<header class="entete"><div class="interieur">
  <a class="marque" href="/"><i aria-hidden="true"></i>QA Factory</a>
  {% if u %}
  <nav aria-label="Navigation principale">
    <a href="/projets" {% if request.url.path.startswith('/projets') %}aria-current="page"{% endif %}>Projets</a>
    <a href="/parametres/squash" {% if request.url.path.startswith('/parametres') %}aria-current="page"{% endif %}>Squash</a>
    {% if u.role == 'admin' %}<a href="/admin/utilisateurs" {% if request.url.path.startswith('/admin') %}aria-current="page"{% endif %}>Équipe</a>{% endif %}
    <a href="/compte" class="discret nom-utilisateur">{{ u.nom }}</a>
    <form method="post" action="/deconnexion"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="lien-bouton" type="submit">Déconnexion</button></form>
  </nav>
  {% endif %}
</div></header>
<main>
{% for f in flashs or [] %}<div class="message {{ f.g }}" role="status">{{ f.m }}</div>{% endfor %}
{% block contenu %}{% endblock %}
</main>
<script src="/statique/app.js"></script>
{% block script %}{% endblock %}
</body>
</html>
