<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}QA Factory{% endblock %}</title>
<link rel="stylesheet" href="/statique/app.css">
</head>
<body>
<header class="entete"><div class="interieur">
  <a class="marque" href="/">QA Factory</a>
  {% if u %}
  <nav>
    <a href="/">Projets</a>
    {% if u.role == 'admin' %}<a href="/admin/utilisateurs">Utilisateurs</a>{% endif %}
  </nav>
  <div class="moi">
    <a href="/compte">{{ u.nom }}</a> <span class="discret" style="color:#cfe0f0">{{ ROLES[u.role] }}</span>
    <form method="post" action="/deconnexion"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Déconnexion</button></form>
  </div>
  {% endif %}
</div></header>
<main>
{% for f in flashs or [] %}<div class="flash {{ f.g }}">{{ f.m }}</div>{% endfor %}
{% block contenu %}{% endblock %}
</main>
<script>
document.addEventListener('submit', function (e) {
  var m = e.target.getAttribute('data-confirmer');
  if (m && !window.confirm(m)) { e.preventDefault(); return; }
  var b = e.target.querySelector('button[type=submit]');
  if (b && !e.target.hasAttribute('data-sans-blocage')) { setTimeout(function () { b.disabled = true; }, 0); }
});
</script>
{% block script %}{% endblock %}
</body>
</html>
